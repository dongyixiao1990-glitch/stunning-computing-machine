<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Detailed Flamingo Silhouette for Fusion360 -->
  <g fill="#000000">
    <!-- Body - elongated oval -->
    <ellipse cx="45" cy="70" rx="22" ry="14"/>
    
    <!-- Tail feathers -->
    <path d="M25 65 Q18 60 22 70 Q18 75 25 72 Z"/>
    
    <!-- Neck - smooth S curve -->
    <path d="M58 62 Q68 45 62 30 Q60 20 65 15" 
          fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="65" cy="16" r="6"/>
    
    <!-- Beak - bent downward -->
    <path d="M69 14 Q78 10 75 20 Q70 22 68 18 Z"/>
    
    <!-- Eye -->
    <circle cx="64" cy="15" r="1.5" fill="#ffffff"/>
    
    <!-- Legs - long thin -->
    <line x1="42" y1="82" x2="38" y2="108" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="82" x2="54" y2="105" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Feet -->
    <path d="M36 108 L32 112 M38 108 L38 113" stroke="#000000" stroke-width="1.5"/>
    <path d="M52 105 L48 110 M54 105 L54 110" stroke="#000000" stroke-width="1.5"/>
    
    <!-- Wing detail -->
    <ellipse cx="35" cy="65" rx="10" ry="6" transform="rotate(-10 35 65)"/>
  </g>
</svg>
