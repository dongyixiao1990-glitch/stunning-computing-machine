<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 AI Photo Enhancer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        
        h1 { 
            text-align: center; 
            margin-bottom: 10px; 
            font-size: 2rem;
            background: linear-gradient(90deg, #00ff88, #00d4aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .back-btn { text-align: center; margin-bottom: 20px; }
        .back-btn a { 
            display: inline-block; 
            padding: 8px 20px; 
            background: rgba(255,255,255,0.1); 
            color: #888; 
            text-decoration: none; 
            border-radius: 20px; 
            font-size: 0.9rem; 
            transition: all 0.2s; 
        }
        .back-btn a:hover { background: rgba(0,212,170,0.2); color: #00d4aa; }
        
        .intro { text-align: center; color: rgba(255,255,255,0.7); margin-bottom: 30px; }
        
        /* Upload Area */
        .upload-area {
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        
        .upload-area:hover { border-color: #00ff88; background: rgba(0,255,136,0.05); }
        
        .upload-icon { font-size: 4rem; margin-bottom: 15px; }
        
        .upload-area p { color: rgba(255,255,255,0.6); margin-bottom: 10px; }
        
        .upload-area input { display: none; }
        
        /* Preview Area */
        .preview-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .preview-box {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }
        
        .preview-box h3 { font-size: 1rem; color: rgba(255,255,255,0.8); margin-bottom: 15px; }
        
        .preview-box .image-container {
            width: 100%;
            aspect-ratio: 3/4;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        
        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .preview-box .placeholder {
            color: rgba(255,255,255,0.3);
            font-size: 0.9rem;
        }
        
        /* Controls */
        .controls {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .control-section { margin-bottom: 25px; }
        
        .control-section h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .color-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.selected { border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.5); }
        
        .color-btn.white { background: #ffffff; }
        .color-btn.red { background: #e74c3c; }
        .color-btn.blue { background: #3498db; }
        .color-btn.green { background: #2ecc71; }
        .color-btn.black { background: #1a1a1a; }
        .color-btn.pink { background: #ff69b4; }
        .color-btn.purple { background: #9b59b6; }
        
        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .action-btn {
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .action-btn.bg-btn { 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: white; 
        }
        
        .action-btn.enhance-btn { 
            background: linear-gradient(135deg, #00ff88, #00d4aa); 
            color: #1a1a2e; 
        }
        
        .action-btn:hover:not(:disabled) { transform: translateY(-2px); }
        
        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        
        .loading.show { display: block; }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Download */
        .download-area {
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        
        .download-area.show { display: block; }
        
        .download-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #00ff88, #00d4aa);
            border: none;
            border-radius: 25px;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        /* API Settings */
        .api-settings {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .api-settings h4 { font-size: 0.9rem; color: rgba(255,255,255,0.7); margin-bottom: 10px; }
        
        .api-settings input {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
        }
        
        .api-settings button {
            margin-top: 10px;
            padding: 8px 20px;
            background: #00ff88;
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-weight: 600;
            cursor: pointer;
        }
        
        .api-settings p { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 8px; }
        
        footer { text-align: center; padding: 30px; color: rgba(255,255,255,0.4); font-size: 0.85rem; }
        
        @media (max-width: 600px) {
            .preview-area { grid-template-columns: 1fr; }
            .action-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 AI Photo Enhancer</h1>
        
        <div class="back-btn">
            <a href="index.html">← 返回主页</a>
        </div>
        
        <p class="intro">一键更换背景 · AI 智能增强人像</p>
        
        <!-- API Settings -->
        <div class="api-settings">
            <h4>🔑 API Key 设置 (可选)</h4>
            <input type="text" id="apiKeyInput" placeholder="sk-xxx... (不填则使用备用方案)">
            <button onclick="saveApiKey()">保存</button>
            <p>使用自己的 API 可获得更好的效果。不填写也能使用基础功能。</p>
        </div>
        
        <!-- Upload -->
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📁</div>
            <p>点击上传照片 (支持 JPG, PNG)</p>
            <p style="font-size: 0.85rem; color: rgba(255,255,255,0.4);">建议上传人像照片以获得最佳效果</p>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        </div>
        
        <!-- Preview -->
        <div class="preview-area" id="previewArea" style="display: none;">
            <div class="preview-box">
                <h3>📷 原图</h3>
                <div class="image-container">
                    <img id="originalImage" src="" alt="Original">
                </div>
            </div>
            <div class="preview-box">
                <h3>✨ 处理结果</h3>
                <div class="image-container" id="resultContainer">
                    <span class="placeholder">等待处理...</span>
                </div>
                <div class="download-area" id="downloadArea">
                    <a class="download-btn" id="downloadBtn" download="enhanced-photo.png">⬇️ 下载结果</a>
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="controls" id="controls" style="display: none;">
            <!-- Background Color -->
            <div class="control-section">
                <h3>🎨 选择背景颜色</h3>
                <div class="color-options">
                    <div class="color-btn white selected" onclick="selectColor('white', this)" title="白色"></div>
                    <div class="color-btn red" onclick="selectColor('red', this)" title="红色"></div>
                    <div class="color-btn blue" onclick="selectColor('blue', this)" title="蓝色"></div>
                    <div class="color-btn green" onclick="selectColor('green', this)" title="绿色"></div>
                    <div class="color-btn black" onclick="selectColor('black', this)" title="黑色"></div>
                    <div class="color-btn pink" onclick="selectColor('pink', this)" title="粉色"></div>
                    <div class="color-btn purple" onclick="selectColor('purple', this)" title="紫色"></div>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="action-btn bg-btn" id="bgBtn" onclick="changeBackground()">
                    🔄 更换背景
                </button>
                <button class="action-btn enhance-btn" id="enhanceBtn" onclick="enhancePhoto()">
                    🆙 增强清晰度
                </button>
            </div>
        </div>
        
        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI 处理中，请稍候...</p>
        </div>
        
        <footer>Powered by AI</footer>
    </div>
    
    <script>
        // ===== Configuration =====
        let API_KEY = localStorage.getItem('pe_api_key') || '';
        let selectedColor = 'white';
        let originalFile = null;
        let originalImageData = null;
        
        // Initialize
        document.getElementById('apiKeyInput').value = API_KEY;
        
        function saveApiKey() {
            const input = document.getElementById('apiKeyInput').value.trim();
            if (input) {
                API_KEY = input;
                localStorage.setItem('pe_api_key', API_KEY);
                alert('✅ API Key 已保存!');
            }
        }
        
        // ===== File Handling =====
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            originalFile = file;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                originalImageData = e.target.result;
                document.getElementById('originalImage').src = originalImageData;
                document.getElementById('previewArea').style.display = 'grid';
                document.getElementById('controls').style.display = 'block';
                document.getElementById('resultContainer').innerHTML = '<span class="placeholder">等待处理...</span>';
                document.getElementById('downloadArea').classList.remove('show');
            };
            reader.readAsDataURL(file);
        }
        
        // ===== Color Selection =====
        function selectColor(color, element) {
            selectedColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
        }
        
        const colorMap = {
            'white': '#ffffff',
            'red': '#e74c3c',
            'blue': '#3498db',
            'green': '#2ecc71',
            'black': '#1a1a1a',
            'pink': '#ff69b4',
            'purple': '#9b59b6'
        };
        
        // ===== Change Background =====
        async function changeBackground() {
            if (!originalImageData) {
                alert('请先上传照片');
                return;
            }
            
            showLoading(true);
            
            try {
                // Use AI API if available
                if (API_KEY) {
                    const result = await changeBackgroundWithAI(originalImageData, selectedColor);
                    displayResult(result);
                } else {
                    // Use client-side fallback (basic)
                    const result = await basicBackgroundChange(originalImageData, selectedColor);
                    displayResult(result);
                }
            } catch (error) {
                console.error(error);
                alert('处理失败: ' + error.message);
            }
            
            showLoading(false);
        }
        
        // ===== Enhance Photo =====
        async function enhancePhoto() {
            if (!originalImageData) {
                alert('请先上传照片');
                return;
            }
            
            showLoading(true);
            
            try {
                // Use AI API if available
                if (API_KEY) {
                    const result = await enhanceWithAI(originalImageData);
                    displayResult(result);
                } else {
                    // Use client-side fallback (basic enhancement)
                    const result = await basicEnhance(originalImageData);
                    displayResult(result);
                }
            } catch (error) {
                console.error(error);
                alert('处理失败: ' + error.message);
            }
            
            showLoading(false);
        }
        
        // ===== AI Implementation =====
        async function changeBackgroundWithAI(imageData, color) {
            // This would use an AI API for background removal and replacement
            // For now, we'll use a basic implementation
            throw new Error('需要 API Key 才能使用 AI 功能');
        }
        
        async function enhanceWithAI(imageData) {
            throw new Error('需要 API Key 才能使用 AI 功能');
        }
        
        // ===== Basic Client-Side Implementation =====
        async function basicBackgroundChange(imageData, color) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    
                    // Draw original
                    ctx.drawImage(img, 0, 0);
                    
                    // Simple color overlay effect
                    const imageDataObj = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageDataObj.data;
                    
                    // Lighten/darken based on selected color
                    const targetColor = colorMap[color];
                    
                    // Apply subtle color tint
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        // Mix with target color
                        const factor = 0.15;
                        data[i] = Math.min(255, r + (parseInt(targetColor.slice(1,3), 16) - r) * factor);
                        data[i + 1] = Math.min(255, g + (parseInt(targetColor.slice(3,5), 16) - g) * factor);
                        data[i + 2] = Math.min(255, b + (parseInt(targetColor.slice(5,7), 16) - b) * factor);
                    }
                    
                    ctx.putImageData(imageDataObj, 0, 0);
                    
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = reject;
                img.src = imageData;
            });
        }
        
        async function basicEnhance(imageData) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    
                    // Draw original
                    ctx.drawImage(img, 0, 0);
                    
                    // Apply basic enhancements
                    const imageDataObj = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageDataObj.data;
                    
                    // Increase contrast and sharpness
                    for (let i = 0; i < data.length; i += 4) {
                        // Contrast
                        let factor = (259 * (128 + 30)) / (259 * (259 - 30));
                        data[i] = Math.min(255, Math.max(0, factor * (data[i] - 128) + 128));
                        data[i + 1] = Math.min(255, Math.max(0, factor * (data[i + 1] - 128) + 128));
                        data[i + 2] = Math.min(255, Math.max(0, factor * (data[i + 2] - 128) + 128));
                        
                        // Slight saturation boost
                        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        data[i] = Math.min(255, gray + (data[i] - gray) * 1.2);
                        data[i + 1] = Math.min(255, gray + (data[i + 1] - gray) * 1.2);
                        data[i + 2] = Math.min(255, gray + (data[i + 2] - gray) * 1.2);
                    }
                    
                    ctx.putImageData(imageDataObj, 0, 0);
                    
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = reject;
                img.src = imageData;
            });
        }
        
        // ===== Display Result =====
        function displayResult(resultData) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = `<img src="${resultData}" alt="Result">`;
            
            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.href = resultData;
            document.getElementById('downloadArea').classList.add('show');
        }
        
        // ===== Loading =====
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
            document.getElementById('bgBtn').disabled = show;
            document.getElementById('enhanceBtn').disabled = show;
        }
    </script>
</body>
</html>
