<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Flamingo Silhouette - Matching User's Original Design -->
  <!-- For Fusion360 Import -->
  
  <g fill="#000000">
    <!-- Body - horizontal oval -->
    <ellipse cx="85" cy="100" rx="40" ry="22"/>
    
    <!-- Tail -->
    <path d="M45 95 Q30 90 35 105 Q30 110 45 108 Z"/>
    
    <!-- Neck - long S-curve going DOWN (characteristic flamingo) -->
    <path d="M115 90 Q140 70 135 50 Q132 35 140 25" 
          fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="140" cy="25" r="9"/>
    
    <!-- Beak - characteristic downward bent beak -->
    <path d="M147 22 Q165 18 160 32 Q152 35 145 28 Z"/>
    
    <!-- Eye -->
    <circle cx="138" cy="23" r="2" fill="#ffffff"/>
    
    <!-- Wing -->
    <ellipse cx="70" cy="95" rx="22" ry="12" transform="rotate(-8 70 95)"/>
    
    <!-- Legs - very tall and thin -->
    <line x1="75" y1="118" x2="65" y2="170" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <line x1="90" y1="118" x2="100" y2="165" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Feet - webbed -->
    <path d="M65 170 L55 178 M65 170 L65 180 M65 170 L72 175" stroke="#000000" stroke-width="3"/>
    <path d="M100 165 L90 173 M100 165 L100 178 M100 165 L107 170" stroke="#000000" stroke-width="3"/>
  </g>
</svg>
