<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 360" width="120" height="360">
  <!-- MYLLÄRI Vertical Letters for Fusion360 Import -->
  <!-- Each letter is on its own line for easy positioning -->
  
  <!-- Letter M -->
  <g fill="#000000">
    <path d="M10 0 L10 50 L25 25 L40 50 L40 0 L32 0 L25 20 L18 0 Z"/>
  </g>
  
  <!-- Letter Y -->
  <g fill="#000000" transform="translate(0, 55)">
    <path d="M0 0 L15 20 L30 0 L22 0 L15 12 L8 0 Z"/>
    <path d="M10 20 L10 50 L20 50 L20 20 Z"/>
  </g>
  
  <!-- Letter L -->
  <g fill="#000000" transform="translate(0, 110)">
    <path d="M0 0 L30 0 L30 8 L8 8 L8 50 L0 50 Z"/>
  </g>
  
  <!-- Letter L (second) -->
  <g fill="#000000" transform="translate(0, 165)">
    <path d="M0 0 L30 0 L30 8 L8 8 L8 50 L0 50 Z"/>
  </g>
  
  <!-- Letter Ä -->
  <g fill="#000000" transform="translate(0, 220)">
    <path d="M0 25 L8 0 L20 0 L28 25 L20 50 L8 50 Z"/>
    <circle cx="7" cy="5" r="3"/>
    <circle cx="21" cy="5" r="3"/>
  </g>
  
  <!-- Letter R -->
  <g fill="#000000" transform="translate(0, 275)">
    <path d="M0 0 L20 0 Q30 0 30 12 Q30 25 20 28 L30 50 L20 50 L12 32 L8 32 L8 50 L0 50 Z"/>
  </g>
  
  <!-- Letter I -->
  <g fill="#000000" transform="translate(0, 330)">
    <path d="M0 0 L20 0 L20 50 L0 50 Z"/>
  </g>
</svg>
