<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator AI - 语音翻译助手</title>
    <meta name="description" content="Voice translator with AI correction in Chinese, English, and Finnish">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #0f0f1a;
            --secondary: #1a1a2e;
            --accent: #00d4aa;
            --accent-hover: #00f5c4;
            --text: #ffffff;
            --text-muted: #8888aa;
            --border: #2a2a4a;
            --card-bg: #16162a;
            --success: #00d4aa;
            --warning: #ffa500;
            --error: #ff4757;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--primary);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(0, 212, 170, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 170, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4aa, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        
        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .lang-btn {
            padding: 12px 24px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text-muted);
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .lang-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        
        .lang-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--primary);
        }
        
        .recorder {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .record-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        
        .record-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 212, 170, 0.4);
        }
        
        .record-btn.recording {
            background: var(--error);
            border-color: var(--error);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(255, 71, 87, 0); }
        }
        
        .record-hint {
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        
        .ai-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .ai-toggle label {
            font-weight: 500;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border);
            border-radius: 26px;
            transition: 0.3s;
        }
        
        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        
        .toggle-switch input:checked + .toggle-slider {
            background: var(--accent);
        }
        
        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(24px);
        }
        
        /* Status */
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }
        
        .status.listening {
            display: block;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }
        
        .status.processing {
            display: block;
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }
        
        .status.success {
            display: block;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }
        
        /* Results Section */
        .results-section {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .results-section h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .result-item {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }
        
        .result-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .result-item h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .result-item .content {
            font-size: 1.2rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            background: var(--secondary);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .result-item .content.original {
            font-style: italic;
            color: var(--text-muted);
        }
        
        .result-item .content.translated {
            color: var(--accent);
            font-weight: 500;
        }
        
        .copy-btn {
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .copy-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }
        
        .copy-btn.copied {
            background: var(--success);
        }
        
        /* Final Output Box - 突出显示 */
        .final-output {
            background: linear-gradient(135deg, rgba(0, 212, 170, 0.15), rgba(0, 170, 255, 0.15));
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 25px;
            margin-top: 20px;
        }
        
        .final-output h3 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .final-output .content {
            font-size: 1.4rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
            font-weight: 500;
        }
        
        .final-output .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .action-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        
        .action-btn.primary {
            background: var(--accent);
            color: var(--primary);
        }
        
        .action-btn.primary:hover {
            background: var(--accent-hover);
        }
        
        .action-btn.secondary {
            background: var(--secondary);
            border: 1px solid var(--border);
            color: var(--text);
        }
        
        .action-btn.secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* History */
        .history {
            margin-top: 30px;
        }
        
        .history h2 {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        
        .history-item {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .history-item:hover {
            border-color: var(--accent);
        }
        
        .history-item .original {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .history-item .translated {
            font-size: 1rem;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .api-note {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid var(--warning);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
            color: var(--warning);
            font-size: 0.85rem;
        }
        
        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .record-btn { width: 100px; height: 100px; font-size: 2.5rem; }
            .lang-btn { padding: 10px 18px; font-size: 0.9rem; }
            .result-item .content { font-size: 1rem; }
            .final-output .content { font-size: 1.15rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ Voice Translator AI</h1>
            <p>语音输入 → AI翻译 → 智能校正</p>
        </header>
        
        <div class="api-note">
            🤖 已连接 MiniMax-M2.5 AI
        </div>
        
        <div class="lang-selector">
            <button class="lang-btn active" data-lang="zh">🇨🇳 中文</button>
            <button class="lang-btn" data-lang="en">🇬🇧 English</button>
            <button class="lang-btn" data-lang="fi">🇫🇮 Suomi</button>
        </div>
        
        <div class="ai-toggle">
            <label>AI 智能校正</label>
            <label class="toggle-switch">
                <input type="checkbox" id="aiCorrect" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        
        <div class="recorder">
            <button class="record-btn" id="recordBtn">🎤</button>
            <p class="record-hint">点击开始录音，再次点击结束</p>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在处理...</p>
        </div>
        
        <!-- 结果展示区域 -->
        <div class="results-section" id="resultsSection" style="display: none;">
            <h2>📋 翻译结果</h2>
            
            <div class="result-item">
                <h3>🎤 原始语音</h3>
                <div class="content original" id="originalText"></div>
            </div>
            
            <div class="result-item">
                <h3>🌍 翻译结果</h3>
                <div class="content translated" id="translatedText"></div>
            </div>
            
            <!-- 最终输出框 - 突出显示 -->
            <div class="final-output" id="finalOutput">
                <h3>✨ 最终输出结果</h3>
                <div class="content" id="finalText"></div>
                <div class="actions">
                    <button class="action-btn primary" onclick="copyFinal()">📋 复制结果</button>
                    <button class="action-btn secondary" onclick="speakFinal()">🔊 朗读</button>
                    <button class="action-btn secondary" onclick="clearResults()">🗑️ 清除</button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Powered by MiniMax-M2.5 AI • 使用 Web Speech API</p>
        </footer>
    </div>
    
    <script>
        // ========== 配置 ==========
        const API_KEY = 'sk-cp-QljDVZSp9muzcrudlIgrN-M95Cwz8bHuRCci8NFVCp2lnGU6wpDm_duG9fq6PSh-EnbcbLI4ACc4WozYfBhfHifBE56O1iF6qZyr6lZrIpDW1SCmgREx-dE';
        const API_URL = 'https://api.minimaxi.com/anthropic/v1/chat/completions';
        
        // ========== 状态 ==========
        let isRecording = false;
        let recognition = null;
        let currentLang = 'zh';
        let currentOriginal = '';
        let currentTranslated = '';
        
        const langLabels = {
            zh: '中文',
            en: 'English',
            fi: 'Suomi'
        };
        
        const langCodes = {
            zh: 'zh-CN',
            en: 'en-US', 
            fi: 'fi-FI'
        };
        
        const langNames = {
            zh: 'Chinese',
            en: 'English',
            fi: 'Finnish'
        };
        
        // UI Elements
        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const loading = document.getElementById('loading');
        const resultsSection = document.getElementById('resultsSection');
        const originalText = document.getElementById('originalText');
        const translatedText = document.getElementById('translatedText');
        const finalText = document.getElementById('finalText');
        const aiCorrectToggle = document.getElementById('aiCorrect');
        const langBtns = document.querySelectorAll('.lang-btn');
        
        // Language selector
        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                langBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLang = btn.dataset.lang;
            });
        });
        
        // Check Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            showStatus('您的浏览器不支持语音识别，请使用 Chrome 或 Edge', 'error');
            recordBtn.disabled = true;
        }
        
        // Initialize Speech Recognition
        function initRecognition() {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = langCodes[currentLang];
            
            recognition.onstart = () => {
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.textContent = '⏹';
                showStatus('正在聆听...', 'listening');
                // 隐藏之前的结果
                resultsSection.style.display = 'none';
            };
            
            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                if (interimTranscript) {
                    showStatus(`识别中: ${interimTranscript}...`, 'listening');
                }
                
                if (finalTranscript) {
                    processVoice(finalTranscript);
                }
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'no-speech') {
                    showStatus('未检测到语音，请重试', 'error');
                    setTimeout(() => stopRecording(), 1500);
                } else {
                    showStatus('识别错误: ' + event.error, 'error');
                }
            };
            
            recognition.onend = () => {
                if (isRecording) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log('Recognition stopped');
                    }
                }
            };
        }
        
        function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }
        
        function startRecording() {
            if (!recognition) {
                initRecognition();
            }
            try {
                recognition.start();
            } catch (e) {
                console.error('Start error:', e);
            }
        }
        
        function stopRecording() {
            isRecording = false;
            recordBtn.classList.remove('recording');
            recordBtn.textContent = '🎤';
            
            if (recognition) {
                recognition.stop();
            }
            
            hideStatus();
        }
        
        // Process voice with MiniMax API
        async function processVoice(text) {
            if (!text.trim()) return;
            
            currentOriginal = text;
            showLoading(true);
            showStatus('AI 翻译中...', 'processing');
            
            try {
                const targetLang = currentLang;
                const useAICorrect = aiCorrectToggle.checked;
                
                let systemPrompt = '';
                let userPrompt = '';
                
                if (useAICorrect) {
                    systemPrompt = `You are a professional translator and language correction expert. Your task is:
1. Identify the language of the input text
2. Translate the text to ${langNames[targetLang]}
3. If the input is already in ${langNames[targetLang]}, correct grammar, word choice, and expression
4. Ensure the output is natural, smooth, and professional
5. ONLY output the translated/corrected content, do not add any explanations`;
                    
                    userPrompt = `Please translate or correct the following to ${langNames[targetLang]}:\n\n${text}`;
                } else {
                    systemPrompt = `You are a professional translator. Translate the input text to ${langNames[targetLang]}. Only output the translated content, do not add any explanations.`;
                    userPrompt = `Translate: ${text}`;
                }
                
                const translated = await callMiniMaxAPI(systemPrompt, userPrompt);
                
                currentTranslated = translated;
                displayResults(text, translated);
                showStatus('翻译完成!', 'success');
                
            } catch (error) {
                console.error('Processing error:', error);
                showStatus('处理失败: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // Call MiniMax API
        async function callMiniMaxAPI(systemPrompt, userPrompt) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'MiniMax-M2.5',
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: userPrompt }
                    ],
                    max_tokens: 4096,
                    temperature: 0.7
                })
            });
            
            if (!response.ok) {
                const error = await response.text();
                throw new Error(`API错误: ${response.status} - ${error}`);
            }
            
            const data = await response.json();
            
            if (data.choices && data.choices[0] && data.choices[0].message) {
                return data.choices[0].message.content.trim();
            } else {
                throw new Error('API返回格式错误');
            }
        }
        
        // Display results
        function displayResults(original, translated) {
            resultsSection.style.display = 'block';
            originalText.textContent = original;
            translatedText.textContent = translated;
            finalText.textContent = translated;
            
            // 滚动到结果区域
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
        }
        
        function hideStatus() {
            status.style.display = 'none';
        }
        
        function showLoading(show) {
            loading.classList.toggle('show', show);
        }
        
        // Copy final result
        function copyFinal() {
            navigator.clipboard.writeText(currentTranslated).then(() => {
                const btn = document.querySelector('.action-btn.primary');
                const original = btn.textContent;
                btn.textContent = '✓ 已复制!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
        
        // Speak the result
        function speakFinal() {
            const utterance = new SpeechSynthesisUtterance(currentTranslated);
            utterance.lang = langCodes[currentLang];
            utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        }
        
        // Clear results
        function clearResults() {
            resultsSection.style.display = 'none';
            currentOriginal = '';
            currentTranslated = '';
        }
        
        // Event listeners
        recordBtn.addEventListener('click', toggleRecording);
        
        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.target.matches('input, textarea')) {
                e.preventDefault();
                toggleRecording();
            }
        });
    </script>
</body>
</html>
