<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 20px; background: linear-gradient(90deg, #00d4aa, #00aaff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .lang-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .lang-btn { padding: 10px 20px; border: 2px solid #2a2a4a; background: #16162a; color: #888; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .lang-btn.active { background: #00d4aa; color: #000; border-color: #00d4aa; }
        
        .ai-toggle { text-align: center; margin-bottom: 20px; padding: 10px; background: #16162a; border-radius: 10px; }
        
        .record-area { text-align: center; margin-bottom: 20px; }
        .record-btn { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #00d4aa; background: #16162a; font-size: 2.5rem; cursor: pointer; }
        .record-btn.recording { background: #ff4757; border-color: #ff4757; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.7); } 50% { box-shadow: 0 0 0 20px rgba(255,71,87,0); } }
        .record-hint { margin-top: 10px; color: #666; font-size: 0.9rem; }
        
        .status-msg { text-align: center; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .status-msg.listen { display: block; background: rgba(255,71,87,0.2); color: #ff4757; }
        .status-msg.process { display: block; background: rgba(255,165,0,0.2); color: #ffa500; }
        .status-msg.done { display: block; background: rgba(0,212,170,0.2); color: #00d4aa; }
        
        .loading { display: none; text-align: center; padding: 30px; }
        .loading.show { display: block; }
        .spinner { width: 40px; height: 40px; border: 3px solid #2a2a4a; border-top-color: #00d4aa; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 结果显示区域 */
        .result-area { background: #16162a; border: 2px solid #2a2a4a; border-radius: 15px; padding: 20px; margin-bottom: 20px; display: none; }
        .result-area.show { display: block; }
        .result-area h2 { font-size: 1rem; color: #888; margin-bottom: 15px; }
        
        .result-box { margin-bottom: 15px; }
        .result-box label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; }
        .result-box .content { background: #0f0f1a; padding: 15px; border-radius: 10px; font-size: 1.1rem; line-height: 1.5; min-height: 50px; word-wrap: break-word; }
        .result-box .content.original { color: #888; font-style: italic; }
        .result-box .content.translated { color: #00d4aa; font-weight: bold; }
        
        .btn-row { display: flex; gap: 10px; }
        .btn-row button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-copy { background: #00d4aa; color: #000; }
        .btn-speak { background: #2a2a4a; color: #fff; }
        
        /* 历史记录 */
        .history-area { margin-top: 30px; }
        .history-area h2 { font-size: 1rem; color: #888; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .clear-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 0.85rem; }
        .clear-btn:hover { color: #ff4757; }
        
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item { background: #16162a; border: 1px solid #2a2a4a; border-radius: 12px; padding: 15px; cursor: pointer; }
        .history-item:hover { border-color: #00d4aa; }
        .history-item .orig { color: #666; font-size: 0.85rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item .trans { color: #00d4aa; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item .time { font-size: 0.7rem; color: #444; margin-top: 5px; }
        
        .no-history { text-align: center; color: #444; padding: 30px; }
        
        footer { text-align: center; padding: 30px; color: #444; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Voice Translator AI</h1>
        
        <!-- 语言选择 -->
        <div class="lang-buttons">
            <button class="lang-btn active" data-lang="zh">中文</button>
            <button class="lang-btn" data-lang="en">English</button>
            <button class="lang-btn" data-lang="fi">Suomi</button>
        </div>
        
        <!-- AI校正 -->
        <div class="ai-toggle">
            <label><input type="checkbox" id="aiCorrect" checked> ✨ AI智能校正</label>
        </div>
        
        <!-- 录音按钮 -->
        <div class="record-area">
            <button class="record-btn" id="recordBtn">🎤</button>
            <p class="record-hint">点击开始录音，再次点击结束</p>
        </div>
        
        <!-- 状态消息 -->
        <div class="status-msg" id="statusMsg"></div>
        
        <!-- 加载中 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>处理中...</p>
        </div>
        
        <!-- 结果显示 -->
        <div class="result-area" id="resultArea">
            <h2>📋 翻译结果</h2>
            
            <div class="result-box">
                <label>🎤 原始语音</label>
                <div class="content original" id="originalContent">--</div>
            </div>
            
            <div class="result-box">
                <label>🌍 翻译结果</label>
                <div class="content translated" id="translatedContent">--</div>
            </div>
            
            <div class="btn-row">
                <button class="btn-copy" onclick="copyResult()">📋 复制结果</button>
                <button class="btn-speak" onclick="speakResult()">🔊 朗读</button>
            </div>
        </div>
        
        <!-- 历史记录 -->
        <div class="history-area">
            <h2>
                <span>📜 历史记录</span>
                <button class="clear-btn" onclick="clearHistory()">清除</button>
            </h2>
            <div class="history-list" id="historyList">
                <div class="no-history">暂无历史记录</div>
            </div>
        </div>
        
        <footer>Powered by MiniMax-M2.5 AI</footer>
    </div>
    
    <script>
    // ===== 配置 =====
    const API_KEY = 'sk-cp-QljDVZSp9muzcrudlIgrN-M95Cwz8bHuRCci8NFVCp2lnGU6wpDm_duG9fq6PSh-EnbcbLI4ACc4WozYfBhfHifBE56O1iF6qZyr6lZrIpDW1SCmgREx-dE';
    const API_URL = 'https://api.minimaxi.com/anthropic/v1/chat/completions';
    
    // ===== 变量 =====
    let isRecording = false;
    let recognition = null;
    let currentLang = 'zh';
    let currentOriginal = '';
    let currentTranslated = '';
    let history = JSON.parse(localStorage.getItem('vt_history') || '[]');
    
    const langCodes = { zh: 'zh-CN', en: 'en-US', fi: 'fi-FI' };
    const langNames = { zh: 'Chinese', en: 'English', fi: 'Finnish' };
    const langLabels = { zh: '中文', en: 'English', fi: 'Suomi' };
    
    // ===== DOM元素 =====
    const recordBtn = document.getElementById('recordBtn');
    const statusMsg = document.getElementById('statusMsg');
    const loading = document.getElementById('loading');
    const resultArea = document.getElementById('resultArea');
    const originalContent = document.getElementById('originalContent');
    const translatedContent = document.getElementById('translatedContent');
    const historyList = document.getElementById('historyList');
    const langBtns = document.querySelectorAll('.lang-btn');
    
    // 初始化
    renderHistory();
    
    // 语言按钮
    langBtns.forEach(btn => {
        btn.onclick = () => {
            langBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentLang = btn.dataset.lang;
        };
    });
    
    // 语音识别
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        showStatus('⚠️ 请使用Chrome浏览器', 'listen');
        recordBtn.disabled = true;
    }
    
    function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = langCodes[currentLang];
        
        recognition.onstart = () => {
            isRecording = true;
            recordBtn.classList.add('recording');
            recordBtn.textContent = '⏹';
            resultArea.classList.remove('show');
            showStatus('🎤 正在聆听...', 'listen');
        };
        
        recognition.onresult = (e) => {
            let final = '', interim = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) final += e.results[i][0].transcript;
                else interim += e.results[i][0].transcript;
            }
            if (interim) showStatus('识别: ' + interim, 'listen');
            if (final) processVoice(final);
        };
        
        recognition.onerror = (e) => {
            if (e.error === 'no-speech') {
                showStatus('⚠️ 未检测到语音', 'listen');
                setTimeout(stopRecording, 1500);
            }
        };
        
        recognition.onend = () => { if (isRecording) try { recognition.start(); } catch(e){} };
    }
    
    recordBtn.onclick = () => {
        if (!isRecording) {
            if (!recognition) initRecognition();
            try { recognition.start(); } catch(e) {}
        } else {
            stopRecording();
        }
    };
    
    function stopRecording() {
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '🎤';
        if (recognition) recognition.stop();
        statusMsg.style.display = 'none';
    }
    
    // 处理语音
    async function processVoice(text) {
        if (!text.trim()) return;
        currentOriginal = text;
        showStatus('🤖 AI翻译中...', 'process');
        loading.classList.add('show');
        
        try {
            const useAI = document.getElementById('aiCorrect').checked;
            const system = useAI 
                ? `Translate to ${langNames[currentLang]}. If already in ${langNames[currentLang]}, correct grammar. Output only the result.`
                : `Translate to ${langNames[currentLang]}. Output only the translated text.`;
            
            const result = await callAPI(system, text);
            currentTranslated = result;
            
            // 显示结果
            originalContent.textContent = text;
            translatedContent.textContent = result;
            resultArea.classList.add('show');
            
            // 保存历史
            addToHistory(text, result);
            
            showStatus('✅ 翻译完成!', 'done');
        } catch (err) {
            showStatus('❌ 错误: ' + err.message, 'listen');
        } finally {
            loading.classList.remove('show');
        }
    }
    
    // API调用
    async function callAPI(system, user) {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
            body: JSON.stringify({
                model: 'MiniMax-M2.5',
                messages: [{ role: 'system', content: system }, { role: 'user', content: 'Translate: ' + user }],
                max_tokens: 4096, temperature: 0.7
            })
        });
        if (!res.ok) throw new Error('API错误');
        const data = await res.json();
        if (!data.choices?.[0]?.message?.content) throw new Error('返回格式错误');
        return data.choices[0].message.content.trim();
    }
    
    // 历史记录
    function addToHistory(orig, trans) {
        const item = { orig, trans, lang: currentLang, time: new Date().toLocaleString() };
        history.unshift(item);
        if (history.length > 20) history.pop();
        localStorage.setItem('vt_history', JSON.stringify(history));
        renderHistory();
    }
    
    function renderHistory() {
        if (history.length === 0) {
            historyList.innerHTML = '<div class="no-history">暂无历史记录</div>';
            return;
        }
        historyList.innerHTML = history.map((item, i) => 
            '<div class="history-item" onclick="viewHistory(' + i + ')">' +
                '<div class="orig">' + item.orig + '</div>' +
                '<div class="trans">' + item.trans + '</div>' +
                '<div class="time">' + langLabels[item.lang] + ' • ' + item.time + '</div>' +
            '</div>'
        ).join('');
    }
    
    function viewHistory(i) {
        const item = history[i];
        currentOriginal = item.orig;
        currentTranslated = item.trans;
        currentLang = item.lang;
        
        // 更新语言按钮
        langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === item.lang));
        
        // 显示结果
        originalContent.textContent = item.orig;
        translatedContent.textContent = item.trans;
        resultArea.classList.add('show');
        resultArea.scrollIntoView({ behavior: 'smooth' });
    }
    
    function clearHistory() {
        if (confirm('清除所有历史?')) {
            history = [];
            localStorage.removeItem('vt_history');
            renderHistory();
        }
    }
    
    // 工具
    function showStatus(msg, type) {
        statusMsg.textContent = msg;
        statusMsg.className = 'status-msg ' + type;
    }
    
    function copyResult() {
        navigator.clipboard.writeText(currentTranslated).then(() => {
            showStatus('✅ 已复制!', 'done');
            setTimeout(() => { statusMsg.style.display = 'none'; }, 2000);
        });
    }
    
    function speakResult() {
        const u = new SpeechSynthesisUtterance(currentTranslated);
        u.lang = langCodes[currentLang];
        speechSynthesis.speak(u);
    }
    
    // 空格键录音
    document.onkeydown = e => {
        if (e.code === 'Space' && !e.target.matches('input,textarea')) {
            e.preventDefault();
            recordBtn.click();
        }
    };
    </script>
</body>
</html>
