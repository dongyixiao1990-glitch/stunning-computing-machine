<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 20px; background: linear-gradient(90deg, #00d4aa, #00aaff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .target-selector { text-align: center; margin-bottom: 20px; }
        .target-selector label { display: block; color: #888; margin-bottom: 10px; font-size: 0.9rem; }
        .target-buttons { display: flex; gap: 10px; justify-content: center; }
        .target-btn { padding: 12px 30px; border: 2px solid #2a2a4a; background: #16162a; color: #888; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .target-btn.active { background: #00d4aa; color: #000; border-color: #00d4aa; }
        
        .ai-toggle { text-align: center; margin-bottom: 20px; padding: 10px; background: #16162a; border-radius: 10px; }
        
        .record-area { text-align: center; margin-bottom: 20px; }
        .record-btn { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #00d4aa; background: #16162a; font-size: 2.5rem; cursor: pointer; }
        .record-btn.recording { background: #ff4757; border-color: #ff4757; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.7); } 50% { box-shadow: 0 0 0 20px rgba(255,71,87,0); } }
        .record-hint { margin-top: 10px; color: #666; font-size: 0.9rem; }
        
        .status-msg { text-align: center; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .status-msg.listen { display: block; background: rgba(255,71,87,0.2); color: #ff4757; }
        .status-msg.process { display: block; background: rgba(255,165,0,0.2); color: #ffa500; }
        .status-msg.done { display: block; background: rgba(0,212,170,0.2); color: #00d4aa; }
        .status-msg.error { display: block; background: rgba(255,71,87,0.3); color: #ff4757; }
        
        .loading { display: none; text-align: center; padding: 30px; }
        .loading.show { display: block; }
        .spinner { width: 40px; height: 40px; border: 3px solid #2a2a4a; border-top-color: #00d4aa; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .result-area { background: #16162a; border: 2px solid #00d4aa; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .result-area h2 { font-size: 1rem; color: #00d4aa; margin-bottom: 15px; }
        
        .result-box { margin-bottom: 15px; }
        .result-box label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; }
        .result-box .content { background: #0f0f1a; padding: 15px; border-radius: 10px; font-size: 1.1rem; line-height: 1.5; min-height: 50px; word-wrap: break-word; cursor: pointer; }
        .result-box .content:hover { background: #1a1a2e; }
        .result-box .content.original { color: #888; }
        .result-box .content.translated { color: #00d4aa; font-weight: bold; }
        
        .btn-row { display: flex; gap: 10px; }
        .btn-row button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-copy { background: #00d4aa; color: #000; }
        .btn-copy:hover { background: #00f5c4; }
        
        .history-area { margin-top: 30px; }
        .history-area h2 { font-size: 1rem; color: #888; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .more-btn { background: #2a2a4a; border: none; color: #888; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
        
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item { background: #16162a; border: 1px solid #2a2a4a; border-radius: 12px; padding: 15px; }
        .history-item .meta { font-size: 0.7rem; color: #444; margin-bottom: 8px; }
        .history-item .orig { color: #888; font-size: 0.9rem; margin-bottom: 8px; line-height: 1.4; }
        .history-item .trans { color: #00d4aa; font-size: 1rem; line-height: 1.4; margin-bottom: 10px; }
        .history-item .actions { display: flex; gap: 8px; }
        .history-item .copy-btn { padding: 6px 12px; background: #2a2a4a; border: none; color: #888; border-radius: 15px; font-size: 0.8rem; cursor: pointer; }
        .history-item .copy-btn:hover { background: #00d4aa; color: #000; }
        
        .no-history { text-align: center; color: #444; padding: 30px; }
        footer { text-align: center; padding: 30px; color: #444; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Voice Translator AI</h1>
        
        <div class="target-selector">
            <label>翻译成:</label>
            <div class="target-buttons">
                <button class="target-btn" data-lang="en" onclick="selectLang('en')">🇬🇧 English</button>
                <button class="target-btn" data-lang="fi" onclick="selectLang('fi')">🇫🇮 Suomi</button>
            </div>
        </div>
        
        <div class="ai-toggle">
            <label><input type="checkbox" id="aiCorrect" checked> ✨ AI智能校正</label>
        </div>
        
        <div class="record-area">
            <button class="record-btn" id="recordBtn" onclick="toggleRecord()">🎤</button>
            <p class="record-hint">点击开始录音，再次点击结束</p>
        </div>
        
        <div class="status-msg" id="statusMsg"></div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI翻译中...</p>
        </div>
        
        <div class="result-area">
            <h2>📋 翻译结果 (点击文字可复制)</h2>
            
            <div class="result-box">
                <label>🎤 原始语音</label>
                <div class="content original" id="originalContent">请开始录音...</div>
            </div>
            
            <div class="result-box">
                <label>🌍 翻译结果</label>
                <div class="content translated" id="translatedContent">翻译结果将显示在这里</div>
            </div>
            
            <div class="btn-row">
                <button class="btn-copy" onclick="copyText('original')">📋 复制原文</button>
                <button class="btn-copy" onclick="copyText('translated')">📋 复制翻译</button>
            </div>
        </div>
        
        <div class="history-area">
            <h2>
                <span>📜 最近历史记录</span>
                <button class="more-btn" onclick="showAllHistory()">查看更多</button>
            </h2>
            <div class="history-list" id="historyList">
                <div class="no-history">暂无历史记录</div>
            </div>
        </div>
        
        <footer>Powered by MiniMax-M2.5 AI</footer>
    </div>
    
    <script>
    // ===== 配置 =====
    const API_KEY = 'sk-cp-QljDVZSp9muzcrudlIgrN-M95Cwz8bHuRCci8NFVCp2lnGU6wpDm_duG9fq6PSh-EnbcbLI4ACc4WozYfBhfHifBE56O1iF6qZyr6lZrIpDW1SCmgREx-dE';
    
    // ===== 变量 =====
    let isRecording = false;
    let recognition = null;
    let targetLang = 'en';
    let currentOriginal = '';
    let currentTranslated = '';
    let allHistory = [];
    let showingAll = false;
    
    const langCodes = { en: 'en-US', fi: 'fi-FI' };
    const langNames = { en: 'English', fi: 'Finnish' };
    const langLabels = { en: '🇬🇧 English', fi: '🇫🇮 Finnish' };
    
    // ===== 初始化 =====
    // 默认选中英文
    document.querySelector('.target-btn[data-lang="en"]').classList.add('active');
    
    // 加载历史
    try {
        allHistory = JSON.parse(localStorage.getItem('vt_history') || '[]');
    } catch(e) { allHistory = []; }
    renderHistory();
    
    // ===== 函数 =====
    function selectLang(lang) {
        targetLang = lang;
        document.querySelectorAll('.target-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });
    }
    
    function toggleRecord() {
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    }
    
    function startRecording() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            showStatus('⚠️ 请使用Chrome浏览器', 'error');
            return;
        }
        
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'zh-CN';  // 识别中文
        
        recognition.onstart = () => {
            isRecording = true;
            document.getElementById('recordBtn').classList.add('recording');
            document.getElementById('recordBtn').textContent = '⏹';
            showStatus('🎤 正在聆听，请说话...', 'listen');
            document.getElementById('originalContent').textContent = '正在识别...';
            document.getElementById('translatedContent').textContent = '等待翻译...';
        };
        
        recognition.onresult = (event) => {
            let finalTranscript = '';
            let interimTranscript = '';
            
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += transcript;
                } else {
                    interimTranscript += transcript;
                }
            }
            
            if (interimTranscript) {
                document.getElementById('originalContent').textContent = interimTranscript;
            }
            
            if (finalTranscript) {
                doTranslate(finalTranscript);
            }
        };
        
        recognition.onerror = (event) => {
            console.log('语音识别错误:', event.error);
            if (event.error === 'no-speech') {
                showStatus('⚠️ 未检测到语音', 'error');
                setTimeout(stopRecording, 1500);
            }
        };
        
        recognition.onend = () => {
            if (isRecording) {
                try { recognition.start(); } catch(e) {}
            }
        };
        
        try {
            recognition.start();
        } catch(e) {
            console.error(e);
        }
    }
    
    function stopRecording() {
        isRecording = false;
        document.getElementById('recordBtn').classList.remove('recording');
        document.getElementById('recordBtn').textContent = '🎤';
        if (recognition) {
            try { recognition.stop(); } catch(e) {}
        }
    }
    
    // ===== 翻译功能 =====
    async function doTranslate(text) {
        if (!text.trim()) return;
        
        currentOriginal = text;
        document.getElementById('originalContent').textContent = text;
        document.getElementById('translatedContent').textContent = '正在翻译...';
        showStatus('🤖 AI翻译中...', 'process');
        document.getElementById('loading').classList.add('show');
        
        const useAI = document.getElementById('aiCorrect').checked;
        const target = langNames[targetLang];
        
        // 构建翻译提示
        let systemPrompt = useAI
            ? `You are a professional translator. Translate the following text to ${target}. If the text is already in ${target}, correct the grammar and improve the expression. Only output the translated/corrected text, nothing else.`
            : `You are a professional translator. Translate the following text to ${target}. Only output the translated text, nothing else.`;
        
        const userPrompt = text;
        
        console.log('目标语言:', target);
        
        try {
            // 调用 MiniMax API
            const response = await fetch('https://api.minimaxi.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + API_KEY
                },
                body: JSON.stringify({
                    model: 'abab6.5s-chat',
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: userPrompt }
                    ],
                    max_tokens: 2048
                })
            });
            
            console.log('API响应状态:', response.status);
            
            if (!response.ok) {
                const errorText = await response.text();
                console.error('API错误:', errorText);
                throw new Error('API错误: ' + response.status);
            }
            
            const data = await response.json();
            console.log('API响应:', data);
            
            if (data.choices && data.choices[0] && data.choices[0].message) {
                currentTranslated = data.choices[0].message.content.trim();
            } else {
                console.error('返回格式:', data);
                throw new Error('返回格式错误');
            }
            
            document.getElementById('translatedContent').textContent = currentTranslated;
            saveHistory(text, currentTranslated);
            showStatus('✅ 翻译完成!', 'done');
            
        } catch (err) {
            console.error('翻译错误:', err);
            document.getElementById('translatedContent').textContent = '❌ 翻译失败: ' + err.message;
            showStatus('❌ 错误: ' + err.message, 'error');
        } finally {
            document.getElementById('loading').classList.remove('show');
        }
    }
    
    // ===== 历史记录 =====
    function saveHistory(orig, trans) {
        const item = { orig, trans, target: targetLang, time: new Date().toLocaleString() };
        allHistory.unshift(item);
        if (allHistory.length > 50) allHistory.pop();
        try {
            localStorage.setItem('vt_history', JSON.stringify(allHistory));
        } catch(e) {}
        renderHistory();
    }
    
    function renderHistory() {
        const list = document.getElementById('historyList');
        const historyToShow = showingAll ? allHistory : allHistory.slice(0, 10);
        
        if (historyToShow.length === 0) {
            list.innerHTML = '<div class="no-history">暂无历史记录</div>';
            return;
        }
        
        let html = '';
        historyToShow.forEach((item, idx) => {
            html += '<div class="history-item">';
            html += '<div class="meta">' + langLabels[item.target] + ' • ' + item.time + '</div>';
            html += '<div class="orig">' + escapeHtml(item.orig) + '</div>';
            html += '<div class="trans">' + escapeHtml(item.trans) + '</div>';
            html += '<div class="actions">';
            html += '<button class="copy-btn" onclick="copyHistory(' + idx + ', \'orig\')">📋 复制原文</button>';
            html += '<button class="copy-btn" onclick="copyHistory(' + idx + ', \'trans\')">📋 复制翻译</button>';
            html += '</div></div>';
        });
        
        list.innerHTML = html;
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function copyHistory(idx, type) {
        const item = showingAll ? allHistory[idx] : allHistory[idx];
        const text = type === 'orig' ? item.orig : item.trans;
        navigator.clipboard.writeText(text).then(() => {
            showStatus('✅ 已复制!', 'done');
        });
    }
    
    function showAllHistory() {
        showingAll = !showingAll;
        document.querySelector('.more-btn').textContent = showingAll ? '收起' : '查看更多';
        renderHistory();
    }
    
    // ===== 复制功能 =====
    function copyText(type) {
        const text = type === 'original' ? currentOriginal : currentTranslated;
        if (!text || text.includes('...') || text.includes('请') || text.includes('等待')) {
            showStatus('⚠️ 没有内容可复制', 'error');
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            showStatus('✅ 已复制到剪贴板!', 'done');
        });
    }
    
    // ===== 工具 =====
    function showStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = 'status-msg ' + type;
    }
    
    // 空格键快捷键
    document.onkeydown = e => {
        if (e.code === 'Space' && !e.target.matches('input,textarea')) {
            e.preventDefault();
            toggleRecord();
        }
    };
    </script>
</body>
</html>
